name: Hacker News Sorting Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  test:
    name: Test on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false # Continue testing other browsers even if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run standard tests
        run: node index.js --${{ matrix.browser }} --report --log-level=info
        continue-on-error: false
      
      - name: Run edge case tests
        run: node index.js --${{ matrix.browser }} --edge-cases --report --log-level=info
        continue-on-error: true # Don't fail entire job on edge case failures
      
      - name: Run negative tests
        run: node index.js --${{ matrix.browser }} --negative --report --log-level=info
        continue-on-error: true
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: test-reports/
          retention-days: 30
      
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: failure-screenshot-*.png
          retention-days: 7
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'test-reports/latest.json';
            
            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const emoji = report.passed === report.total ? '✅' : '❌';
              
              const comment = `## ${emoji} Test Results - ${{ matrix.browser }}
              
              - **Total:** ${report.total}
              - **Passed:** ${report.passed}
              - **Failed:** ${report.failed}
              - **Success Rate:** ${((report.passed / report.total) * 100).toFixed(1)}%
              
              [View detailed report](../actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
  
  comprehensive-test:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install all Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run all tests on all browsers
        run: node index.js --all-browsers --all-tests --report --log-level=info
        env:
          METRICS_ENDPOINT: ${{ secrets.METRICS_ENDPOINT }} # Optional: for monitoring integration
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f test-reports/latest.json ]; then
            cat test-reports/latest.json | jq -r '"- Total Tests: \(.total)\n- Passed: \(.passed)\n- Failed: \(.failed)\n- Success Rate: \((.passed / .total * 100 | floor))%"' >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload comprehensive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-reports
          path: test-reports/
          retention-days: 90
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Optional: Send notification to Slack, Discord, etc.
            console.log('Comprehensive tests failed! Check artifacts for details.');

  # Optional: Deploy reports to GitHub Pages
  deploy-reports:
    name: Deploy Test Reports
    needs: [test, comprehensive-test]
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      
      - name: Create index page
        run: |
          mkdir -p gh-pages
          cat > gh-pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>HN Sorting Test Reports</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              h1 { color: #333; }
              .report-list { list-style: none; padding: 0; }
              .report-list li { padding: 10px; margin: 10px 0; background: #f5f5f5; border-radius: 5px; }
              .report-list a { text-decoration: none; color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>Hacker News Sorting Test Reports</h1>
            <p>Latest test results and historical data</p>
            <ul class="report-list">
              <li><a href="./latest/">Latest Test Run</a></li>
              <li><a href="./chromium/">Chromium Tests</a></li>
              <li><a href="./firefox/">Firefox Tests</a></li>
              <li><a href="./webkit/">WebKit Tests</a></li>
              <li><a href="./comprehensive/">Comprehensive Suite</a></li>
            </ul>
          </body>
          </html>
          EOF
          
          # Copy reports
          cp -r all-reports/* gh-pages/ || true
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
